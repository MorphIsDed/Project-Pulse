[project]
name = "projectpulse-backend"
version = "0.1.0"
description = "ProjectPulse Flask API"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
  "sentry-sdk[flask]>=2.0,<3.0",
  "Flask-SQLAlchemy>=3.1,<4.0",
  "Flask-Migrate>=4.0,<5.0",
  "Flask-WTF>=1.2,<2.0",
  "Flask-Login>=0.6,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["instance*"]
