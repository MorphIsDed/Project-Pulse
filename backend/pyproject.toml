[project]
name = "projectpulse-backend"
version = "0.1.0"
description = "ProjectPulse Flask API"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["instance*"]
